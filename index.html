const missCard=n=>{const L=missed2();return L.length?`<div class="card"><b>Пропустили ${n} тренировки подряд (${L.length})</b><div class="mut">${L.map(a=>esc(a.n)).join(", ")}</div><button class="btn s" onclick="copyMissed()">Скопировать сообщение родителям</button></div>`:""}
function copyMissed(){if(S.role!="c")return;const L=missed2();if(!L.length)return;copyText(L.map(a=>"Здравствуйте! "+firstName(a)+" пропустил(а) две последние тренировки группы «"+GR[S.g].name+"». Всё ли в порядке? Ждём на занятии.").join("\n\n"),"Сообщение скопировано")}
function absent(){const k=attDate().k,rec=(ATT[S.g]||{})[k];return rec?mem().filter(a=>!rec.includes(a.id)):[]}
function copyAbsent(){if(S.role!="c")return;const L=absent(),cur=attDate();if(!L.length)return;copyText(L.map(a=>"Здравствуйте! "+firstName(a)+" не был(а) на тренировке "+attLabel(cur).split(" · ")[0]+". Всё ли в порядке?").join("\n\n"),"Сообщение скопировано")}
const attDays=gi=>Object.keys(ATT[gi]||{}).sort().reverse();
function attStat(id,gi){const ds=attDays(gi).slice(0,12),p=ds.filter(k=>ATT[gi][k].includes(id)).length,n=ds.length;return{p,n,pct:n?Math.round(p*100/n):null}}
function kidSummary(a){const gi=GR.findIndex(g=>g.m.includes(a.id)),st=gi<0?null:attStat(a.id,gi),nx=openList(a)[0],cm=TASKS.filter(t=>R[t.id]&&R[t.id][a.id]&&R[t.id][a.id].c).sort((x,y)=>y.ts-x.ts)[0];
return `<div class="card sum"><b>Сводка: ${esc(a.n)}</b><div>${beltHTML(a.belt)}</div>${st&&st.n?`<div>Посещаемость: ${st.p} из ${st.n} тренировок · ${st.pct}%</div>`:""}<div>${nx?`Ближайшее задание: <b>${esc(nx.title)}</b>${nx.due?" · до "+esc(nx.due):""}`:"Активных заданий нет"}</div>${cm?`<div><b>Комментарий тренера:</b> ${esc(R[cm.id][a.id].c)}</div>`:""}<button class="btn" onclick="go('home')">Открыть задания</button></div>`}
const attCard=id=>{const gi=GR.findIndex(g=>g.m.includes(id)),s=gi<0?null:attStat(id,gi);return s&&s.n?`<div class="card"><div class="mut">Посещаемость</div><b>${s.p} из ${s.n} тренировок · ${s.pct}%</b><div class="mut">последние тренировки группы</div></div>`:""};
const T=id=>TASKS.find(t=>t.id==id);
const curT=a=>{let b=null;for(const t of TASKS)if(t.targets.includes(a.id)&&(!b||t.ts>=b.ts))b=t;return b};
const rs=a=>{const t=curT(a);return t?R[t.id][a.id]:null};
const st=a=>{const r=rs(a);return r?r.st:"none"};
const vp=a=>TASKS.some(t=>R[t.id][a.id]&&R[t.id][a.id].video=="pending");
const WL=()=>{const t=T(S.wt);return t?t.ex.map(i=>EX[i]):[]};
const ymd=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dur=t=>Math.round(t.ex.reduce((x,i)=>x+EX[i].s,0)/60);
const openList=a=>TASKS.filter(t=>!t.closed&&R[t.id][a.id]&&R[t.id][a.id].st!="done").sort((x,y)=>(x.due||"9")<(y.due||"9")?-1:(x.due||"9")>(y.due||"9")?1:y.ts-x.ts);
const doneList=a=>TASKS.filter(t=>R[t.id][a.id]&&R[t.id][a.id].st=="done").sort((x,y)=>R[y.id][a.id].doneAt-R[x.id][a.id].doneAt);
const pendingVideos=()=>{const o=[];for(const t of TASKS)for(const id of GR[S.g].m){const r=R[t.id][id];if(r&&r.video=="pending")o.push({t,a:A[id],r})}return o.sort((x,y)=>x.t.ts-y.t.ts)};
const fileOk=()=>S.file&&S.file.tid==S.wt&&S.file.aid==me().id;
function say(t){let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";e.className="toast";e.setAttribute("role","status");document.body.appendChild(e)}e.textContent=t;clearTimeout(S.tt);S.tt=setTimeout(()=>{e.remove()},2400)}
function stopTimer(){if(S.run){clearInterval(S.run);S.run=null}}
function dropFile(){if(S.file){URL.revokeObjectURL(S.file.url);S.file=null}}
function resetWork(){stopTimer();dropFile();S.step=-1;S.wt=null;S.saved=false}
function setRole(r,keep){resetWork();if(r=="o"){S.acct="o";r=S.ws=="group"?"c":"a"}else{if(r=="a")return;S.acct=r}   // «a» (администратор) только у владельца и только через пространство
S.role=r;S.tab=keep&&(r!="k"||S.ks!==null)?"settings":r=="p"?"kids":r=="k"?(S.ks!==null?"home":"login"):"home";S.cr=null;S.ls=null;S.ath=null;S.ac=null;S.acl=false;S.ai=null;S.oc=null;S.ck="all";S.cq="";S.cf="all";S.cs="name";S.cz=false;S.ifl="all";S.gp=30;S.hp=7;S.f="all";S.q="";draw()}
const MAIN={a:["home","coaches","growth","issues","courses","settings"],c:["home","group","task","belts","prog","settings","more"]};
function setWs(w){if(S.acct!="o"||(w!="admin"&&w!="group"))return;if(S.role==(w=="admin"?"a":"c"))return;S.wsTab[S.role]=S.tab;S.ws=w;setRole("o");const t=S.wsTab[S.role];if(t&&MAIN[S.role].includes(t)){S.tab=t;draw()}}
function go(t){stopTimer();S.tab=t;S.step=-1;S.cr=null;S.ls=null;S.ath=null;S.ac=null;S.acl=false;S.ai=null;S.oc=null;draw()}
function pickKid(id){if(S.role!="p"||!FAM.includes(id))return;resetWork();S.me=id;S.cr=null;S.ls=null;S.hp=7;draw()}
function logoutKid(){resetWork();S.ks=null;S.tab="login";draw()}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function start(tid){if(S.role=="c")return;const t=T(tid),a=me(),r=t&&R[tid][a.id];if(!r)return;resetWork();if(r.st=="assigned")r.st="started";S.wt=tid;S.step=0;S.left=WL()[0].s;draw()}
function step(d){stopTimer();S.step+=d;const w=WL();if(S.step>=0&&S.step<w.length)S.left=w[S.step].s;draw()}
function toggle(){const w=WL();if(!w[S.step])return;if(S.run){S.left=Math.max(0,Math.ceil((S.end-Date.now())/1000));stopTimer()}else{if(S.left<=0)S.left=w[S.step].s;S.end=Date.now()+S.left*1000;S.run=setInterval(tick,250)}draw()}
function tick(){const w=WL()[S.step];if(!w||S.step<0){stopTimer();return}S.left=Math.max(0,Math.ceil((S.end-Date.now())/1000));const t=$("#tm");if(t)t.textContent=fmt(S.left);const g=$("#rg");if(g)g.setAttribute("stroke-dashoffset",100*(1-S.left/w.s));if(!S.left){stopTimer();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}draw()}}
function exitWork(){if(confirm("Выйти из тренировки? Прогресс упражнений не сохранится.")){resetWork();draw()}}
function finish(){if(S.role=="c"||S.saved)return;const t=T(S.wt),a=me(),r=t&&R[S.wt][a.id];if(!r)return;stopTimer();const n=Date.now();if(r.st!="done"){r.st="done";r.doneAt=n}WS.push({tid:t.id,aid:a.id,ts:n});S.saved=true;say("Выполнение сохранено в демо");draw()}
function closeWork(){if(S.file&&!confirm("Выбранное видео не отправлено и будет удалено из окна. Закрыть?"))return;resetWork();S.tab="home";draw()}
function pick(e){const f=e.target.files[0];if(!f||!T(S.wt))return;if(!/^video\//.test(f.type)){say("Выберите видеофайл");return}
if(f.size>200*1024*1024){say("Файл больше 200 МБ. Выберите короче");return}dropFile();S.file={name:f.name,url:URL.createObjectURL(f),tid:S.wt,aid:me().id};draw()}
const QR=["Молодец!","Следи за спиной","Повтори медленнее"];
function quick(tid,aid,i){const e=$("#c"+tid+"_"+aid);if(e&&QR[i])e.value=QR[i]}
function review(tid,aid,v){if(S.role!="c"||(v!="reviewed"&&v!="redo"))return;const t=T(tid),r=t&&R[tid][aid];if(!r||!t.targets.includes(aid)||!GR[S.g].m.includes(aid)||r.video!="pending")return;const c=$("#c"+tid+"_"+aid).value.trim().slice(0,500);if(v=="redo"&&!c){say("Напишите, что повторить");return}r.video=v;if(c)r.c=c;say(v=="reviewed"?"Видео проверено":"Просьба повторить отправлена");draw()}
function calc(){return gstats()}
const aggr=a=>{const o={total:0,done:0,open:0,started:0,assigned:0,videos:0};for(const t of TASKS){const r=R[t.id][a.id];if(!r)continue;if(r.video=="pending")o.videos++;if(t.closed||r.st=="exempt")continue;o.total++;if(r.st=="done")o.done++;else{o.open++;if(r.st=="started")o.started++;else o.assigned++}}return o};
const gstats=()=>{const o={athletes:0,total:0,done:0,open:0,started:0,assigned:0,videos:0,aOpen:0,aVid:0};for(const a of mem()){const g=aggr(a);o.athletes++;for(const k of["total","done","open","started","assigned","videos"])o[k]+=g[k];if(g.open)o.aOpen++;if(g.videos)o.aVid++}o.v=o.videos;return o};

const THEME_DEFAULT="dark";   // пока выбора нет, тема тёмная; сохранённый выбор (включая «Авто») сильнее
let themePref=(()=>{const v=store.get(THEME_KEY);return THEMES.includes(v)?v:THEME_DEFAULT})();
const sysDark=()=>{try{return !!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)}catch(e){return false}};
const effTheme=()=>{if(themePref!=="auto")return themePref;const W=TG();if(inTelegram()&&W.colorScheme)return W.colorScheme=="dark"?"dark":"light";return sysDark()?"dark":"light"};
const THEME_COLORS={dark:{hdr:"#0B0C0E",bg:"#0B0C0E"},light:{hdr:"#141518",bg:"#F4F4F2"}};   // те же значения, что --hdr и --bg в CSS
function applyTheme(){const e=effTheme(),C=THEME_COLORS[e];document.documentElement.setAttribute("data-theme",e);try{const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",C.hdr)}catch(x){}if(tgDone&&inTelegram()){const W=TG();try{W.setHeaderColor(C.hdr);W.setBackgroundColor(C.bg)}catch(x){}}}
function setTheme(v){if(!THEMES.includes(v))return;themePref=v;store.set(THEME_KEY,v);applyTheme();draw()}
try{const mq=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");if(mq&&mq.addEventListener)mq.addEventListener("change",()=>{if(themePref==="auto"){applyTheme();draw()}})}catch(e){}
function demoShort(){const W=TG();return "Тестовая версия. Не для настоящих детей: данные учебные. "+(inTelegram()?"Открыто в Telegram ("+esc(W.platform)+", API "+esc(W.version)+").":"Открыто в обычном браузере.")}
function demoNote(){const W=TG();return "Тестовая версия: данные учебные и не сохраняются (кроме выбора темы). Не для настоящих детей. "+(inTelegram()?"Открыто в Telegram ("+esc(W.platform)+", API "+esc(W.version)+").":"Открыто в обычном браузере.")}
function tgBackNeeded(){return S.step>=0||S.ls!==null||S.cr!==null||(S.role=="c"&&S.ath!==null&&S.tab=="group")||(S.role=="a"&&((S.tab=="coaches"&&S.ac!==null)||(S.tab=="issues"&&S.ai!==null)||(S.tab=="courses"&&S.oc!==null)))||!!(SUB[S.role]&&SUB[S.role][S.tab])}
function tgBack(){if(S.step>=0){S.saved?closeWork():exitWork();return}back()}
function syncTg(){if(!tgDone||!inTelegram())return;const W=TG();try{const need=tgBackNeeded();if(need)W.BackButton.show();else W.BackButton.hide();document.documentElement.classList.toggle("tgback",need)}catch(e){}
try{if((S.step>=0&&!S.saved)||S.file)W.enableClosingConfirmation();else W.disableClosingConfirmation()}catch(e){}}
function initTelegram(){if(tgDone)return;const W=TG();if(!W||!inTelegram())return;tgDone=true;
try{document.documentElement.classList.add("tg")}catch(e){}
try{W.ready()}catch(e){}
try{W.expand()}catch(e){}
try{if(W.isVersionAtLeast&&W.isVersionAtLeast("7.7"))W.disableVerticalSwipes()}catch(e){}
try{applyTheme();W.onEvent("themeChanged",()=>{try{applyTheme();draw()}catch(e){}})}catch(e){}
try{W.BackButton.onClick(tgBack)}catch(e){}
draw()}
function draw(keep){try{draw0(keep);window.__started=true;syncTg()}catch(e){if(window.__fatal)window.__fatal(e&&e.message?e.message:String(e));else throw e}}
applyTheme();
draw();
initTelegram();
addEventListener("load",initTelegram);
{const sdk=document.getElementById&&document.getElementById("tgsdk");if(sdk)sdk.addEventListener("load",initTelegram)}
</script></body></html>
